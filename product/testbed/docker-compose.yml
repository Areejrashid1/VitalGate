# VitalGate test bed, site A (generated). Independent of the training lab: different PACS image (orthancteam),
# DCMTK/nmap clients, different IPs/ports/AE titles, netem network noise. Isolated network (internal: true).
name: vitalgate-testbed
networks:
  tb_a:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 172.28.1.0/24
        ip_range: 172.28.1.192/26
volumes:
  pacsdb_a: {}
  quardb_a: {}
services:
  pacs-a:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    sysctls:                       # the PEP (pep-a) shares this namespace and forwards quarantined uploads to quar-a
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.default.send_redirects: 0
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: 'false'
      VERBOSE_STARTUP: 'false'
    volumes:
    - ./pacs/orthanc-a.json:/etc/orthanc/vitalgate.json:ro
    - pacsdb_a:/var/lib/orthanc/db
    networks:
      tb_a:
        ipv4_address: 172.28.1.20
  quar-a:                          # quarantine store: holds uploads from quarantined devices until they are checked
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: 'false'
      VERBOSE_STARTUP: 'false'
    volumes:
    - ./pacs/orthanc-q.json:/etc/orthanc/vitalgate.json:ro
    - quardb_a:/var/lib/orthanc/db
    networks:
      tb_a:
        ipv4_address: 172.28.1.21
  pep-a:                           # VitalGate policy enforcement point: nftables in the PACS network namespace
    build: ./pep
    image: vitalgate-tb-pep:1
    network_mode: service:pacs-a
    cap_add:
    - NET_ADMIN
    - NET_RAW
    restart: unless-stopped
    volumes:
    - ./out:/out
    depends_on:
    - pacs-a
    - quar-a
  cap-a:
    image: nicolaka/netshoot
    network_mode: service:pacs-a
    cap_add:
    - NET_ADMIN
    - NET_RAW
    restart: unless-stopped
    volumes:
    - ./out:/out
    depends_on:
    - pacs-a
    entrypoint:
    - sh
    - -c
    command:
    - mkdir -p /out/pcap && exec tcpdump -i eth0 -s 512 -U -G 300 -w /out/pcap/tbA_%Y%m%d_%H%M%S.pcap
  ct-a:
    image: vitalgate-tb-sim:1
    build: ./sim
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    volumes:
    - ./out:/out
    environment:
      SITE: A
      PACS_HOST: pacs-a
      PACS_PORT: '104'
      PACS_AET: VG_ARCHIVE
      PACS_HTTP: '8042'
      SPEED: ${SPEED:-1}
      DAY_S: ${DAY_S:-7200}
      ROLE: modality
      MOD: CT
      AET: CT_SCAN31
      MEAN_S: '90'
      EXAM_IMAGES: 40,200
      MAX_PDU: '16384'
      NETEM: delay 3ms loss 0.1%
    depends_on:
    - pacs-a
    networks:
      tb_a:
        ipv4_address: 172.28.1.31
    command:
    - python3
    - /app/benign.py
  mr-a:
    image: vitalgate-tb-sim:1
    build: ./sim
    restart: unless-stopped
